[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "battlecode"
version = "0.1.0"
description = "Cambridge Battlecode bot"
requires-python = ">=3.12"
dependencies = [
    "cambc>=1.5.3",
    "networkx>=3.6.1",
    "pandas>=3.0.2",
    "pillow>=12.1.1",
    "protobuf>=7.34.0",
    "scipy>=1.17.1",
]

[project.scripts]
batch-analyze = "scripts.batch_analyze:main"
compare-belief = "scripts.compare_belief:main"
decode-exfil = "scripts.decode_exfil:main"
decode-memscan = "scripts.decode_memscan:main"
decode-source = "scripts.decode_source:main"
download-all = "scripts.download_all:main"
download-match = "scripts.download_match:main"
extract-exfil = "scripts.extract_exfil:main"
flow-visualize = "scripts.flow_visualize:main"
livelock-analyze = "scripts.livelock_analyze:main"
network-optimise = "scripts.network_optimise:main"
network-visualize = "scripts.network_visualize:main"
online = "scripts.online:main"
online-analyze = "scripts.online_analyze:main"
raid-trace = "scripts.raid_trace:main"
remote-ci = "scripts.remote_ci:main"
replay-analyze = "scripts.analysis.__main__:main"
replay-debug = "scripts.replay_debug:main"
replay-exfil = "scripts.replay_exfil:main"
replay-full = "scripts.replay_full:main"
replay-map = "scripts.replay_map:main"
replay-markers = "scripts.replay_markers:main"
tournament = "scripts.tournament:main"
trace-builder = "scripts.trace_builder:main"
verify-network = "scripts.verify_network:main"
wait-match = "scripts.wait_match:main"
render-map = "scripts.render_map:main"
bench-histograms = "scripts.bench_histograms:main"
bench-hpastar = "scripts.bench_hpastar:main"
bench-hpastar-ab = "scripts.bench_hpastar_ab:main"
bench-hpastar-sim = "scripts.bench_hpastar_sim:main"
bench-landmarks = "scripts.bench_landmarks:main"
bench-pathfinding = "scripts.bench_pathfinding:main"
bench-pathfinding-final = "scripts.bench_pathfinding_final:main"
bench-pathfinding-techniques = "scripts.bench_pathfinding_techniques:main"
bench-tortuosity = "scripts.bench_tortuosity:main"

[dependency-groups]
dev = ["pyright", "ruff", "ty"]

[tool.uv.build-backend]
module-root = ""
module-name = ["scripts", "proto"]

[tool.ruff]
exclude = ["ref"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",
    "COM812",
    "D",
    "E501",
    "INP001",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S101",
    "S310",
    "S311",
    "S603",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"scripts/analysis/*" = ["E402", "TID252", "TC001", "TC003", "PLC0415"]
"proto/*.pyi" = ["A002", "ANN003", "N802", "PYI021"]

[tool.ty.environment]
extra-paths = [".", "scripts", "proto"]

[tool.ty.src]
exclude = ["ref/", "bots/"]

[tool.uv.workspace]
members = [
    "bots/misc/*",
    "bots/test/*",
    "bots/intgrah/*",
    "bots/beacon/*",
    "bots/exploit/*",
    "bots/adgato/*",
]
