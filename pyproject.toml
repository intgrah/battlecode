[project]
name = "battlecode"
version = "0.1.0"
description = "Cambridge Battlecode bot"
requires-python = ">=3.12"
dependencies = [
    "cambc>=1.4.3",
    "networkx>=3.6.1",
    "pillow>=12.1.1",
    "protobuf>=7.34.0",
]

[dependency-groups]
dev = ["ruff>=0.15.6", "ty>=0.0.22"]

[tool.ruff]
exclude = ["ref"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",
    "D",
    "E501",
    "INP001",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S101",
    "S310",
    "S311",
    "S603",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"scripts/analysis/*" = ["TID252", "TC001", "TC003", "PLC0415"]
"proto/*.pyi" = ["N802", "PYI021"]

[tool.ty.environment]
extra-paths = [".", "scripts", "proto"]

[tool.ty.src]
exclude = ["ref/"]

[tool.uv.workspace]
members = ["test"]
