[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "battlecode"
version = "0.1.0"
description = "Cambridge Battlecode bot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cambc>=1.7.1",
    "hcloud>=2.17.1",
    "networkx>=3.6.1",
    "pillow>=12.1.1",
    "scipy>=1.17.1",
    "bench-nav",
    "proto",
    "visualiser",
]

[project.scripts]
hetzner = "scripts.hetzner:main"
batch-analyze = "scripts.batch_analyze:main"
compare-belief = "scripts.compare_belief:main"
download-all = "scripts.download_all:main"
download-match = "scripts.download_match:main"
flow-visualize = "scripts.flow_visualize:main"
network-optimise = "scripts.network_optimise:main"
network-visualize = "scripts.network_visualize:main"
online = "scripts.online:main"
online-analyze = "scripts.online_analyze:main"
raid-trace = "scripts.raid_trace:main"
match-report = "scripts.match_report:main"
replay-analyze = "scripts.analysis.__main__:main"
replay-debug = "scripts.replay_debug:main"
replay-full = "scripts.replay_full:main"
replay-map = "scripts.replay_map:main"
replay-markers = "scripts.replay_markers:main"
tournament = "scripts.tournament:main"
trace-builder = "scripts.trace_builder:main"
verify-network = "scripts.verify_network:main"
wait-match = "scripts.wait_match:main"
render-map = "scripts.render_map:main"
bench-nav = "bench_nav.__main__:main"
replay-times = "scripts.replay_times:main"
replay-livelock = "scripts.replay_livelock:main"

[dependency-groups]
dev = [
    "hcloud>=2.17.1",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pillow>=12.1.1",
    "pre-commit>=4.5.1",
    "protobuf>=7.34.1",
    "pydeps>=3.0.2",
    "ruff",
    "scipy>=1.17.1",
    "ty",
    "vulture>=2.16",
]

[tool.uv.sources]
bench-nav = { workspace = true }
proto = { workspace = true }
visualiser = { workspace = true }

[tool.uv.build-backend]
module-root = ""
module-name = ["scripts"]

[tool.ruff]
exclude = ["ref", "archive/cambc-1.2.0"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",    # complex-structure
    "COM812",  # missing-trailing-comma
    "D",       # documentation
    "E501",    # line-too-long
    "ERA001",  # commented-out-code
    "INP001",  # implicit-namespace-package
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "S101",    # assert
    "S310",    # suspicious-url-open-usage
    "S311",    # suspicious-non-cryptographic-random-usage
    "S603",    # subprocess-without-shell-equals-true
    "SLF001",  # private-member-access
    "T201",    # print
]

[tool.ruff.lint.per-file-ignores]
"scripts/analysis/*" = [
    "E402",    # module-import-not-at-top-of-file
    "TID252",  # relative-imports
    "TC001",   # typing-only-first-party-import
    "TC003",   # typing-only-standard-library-import
    "PLC0415", # import-outside-top-level
]

[tool.ty.environment]
extra-paths = [".", "scripts"]

[tool.ty.src]
exclude = ["ref/", "bots/"]

[tool.uv.workspace]
members = [
    "bots/misc/*",
    "bots/test/*",
    "bots/intgrah/*",
    "bots/beacon/*",
    "bots/beacon-claude/*",
    "bots/nahhh/*",
    "bots/adgato/*",
    "bots/drewfett/*",
    "bots/nothing/*",
    "pkg/visualiser",
    "pkg/proto",
    "pkg/bench_nav",
]
