[project]
name = "battlecode"
version = "0.1.0"
description = "Cambridge Battlecode bot"
requires-python = ">=3.12"
dependencies = [
    "cambc>=1.4.2",
    "networkx>=3.6.1",
    "pillow>=12.1.1",
    "protobuf>=7.34.0",
]

[dependency-groups]
dev = ["ruff>=0.15.6", "ty>=0.0.22"]

[tool.ruff]
exclude = ["ref"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",
    "D",
    "E501",
    "INP001",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S101",
    "S310",
    "S311",
    "S603",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"scripts/analysis/*" = ["TID252", "TC001", "TC003", "PLC0415"]
"proto/*.pyi" = ["N802", "PYI021"]

[tool.ty.environment]
extra-paths = [".", "scripts", "proto"]

[tool.ty.src]
# Multi-file bots are checked independently via `ty check --project bots/<bot>`
# (each has its own ty.toml with environment.root = ["."])
exclude = [
    "ref/",
    "bots/adgato/",
    "bots/astar_test/",
    "bots/v27/",
    "bots/v28/",
    "bots/v29a/",
    "bots/v29b/",
    "bots/v29c/",
    "bots/v30/",
    "bots/v31/",
    "bots/v32/",
    "bots/v38/",
    "bots/v39/",
    "bots/v40/",
    "bots/v41/",
    "bots/v42/",
]

[tool.uv.workspace]
members = ["test"]
