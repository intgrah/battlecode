[workspace]
resolver = "2"
members = [
    "crates/cambc-proto",
    "crates/engine",
    "crates/titan-core",
    "crates/titan-blueprint",
    "crates/titan-bugnav",
    "crates/titan-replay",
    "crates/titan-opening",
    "crates/titan",
    "crates/pyrust-shim",
    "crates/pyrust-translate",
    "crates/pyrust-harness",
    "crates/pyrust-macros",
    "crates/pyrust-ra-spike",
    "crates/cambc-libre-engine",
    "crates/cambc-libre-replay",
    "crates/cambc-libre",
    "crates/cambc",
    "crates/pong_sim",
    "crates/pong_sa",
    "bots/rs/v55",
    "bots/rs/v56",
    "bots/rs/nothing/*",
    "bots/rs/drewfett/v1000",
    "bots/rs/drewfett/v1001",
    "bots/elf/nothing",
    "crates/cambc-next-engine",
    "crates/cambc-next-sdk",
]
exclude = ["crates/pyrust-runner"]

[workspace.dependencies.cambc-libre-engine]
path = "crates/cambc-libre-engine"
[workspace.dependencies.pong_sa]
path = "crates/pong_sa"
[workspace.dependencies.cambc-libre-replay]
path = "crates/cambc-libre-replay"
[workspace.dependencies.cambc]
path = "crates/cambc"
[workspace.dependencies.pyrust]
path = "crates/pyrust-shim"
[workspace.dependencies.pyrust-translate]
path = "crates/pyrust-translate"

[workspace.package]
edition = "2024"

[workspace.dependencies]
cambc-proto = { path = "crates/cambc-proto" }
titan-core = { path = "crates/titan-core" }
eframe = "0.34.1"
image = "0.25.10"
prost = "0.14.3"
prost-build = "0.14.3"
rayon = "1.12"
rfd = "0.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
