[project]
name = "cambcpypy"
version = "1.6.2-alpha"
description = "Pure Python Battlecode engine for PyPy"
requires-python = ">=3.11"
dependencies = ["proto", "click", "rich"]

[project.scripts]
cambcpypy = "cambcpypy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cambcpypy"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
proto = { path = "../proto" }
