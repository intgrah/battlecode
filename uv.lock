[[package]]
name = "battlecode"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "bench-nav" },
    { name = "cambc" },
    { name = "hcloud" },
    { name = "networkx" },
    { name = "pillow" },
    { name = "proto" },
    { name = "scipy" },
    { name = "visualiser" },
]

[package.dev-dependencies]
dev = [
    { name = "hcloud" },
    { name = "matplotlib" },
    { name = "networkx" },
    { name = "pandas" },
    { name = "pillow" },
    { name = "pre-commit" },
    { name = "protobuf" },
    { name = "pydeps" },
    { name = "ruff" },
    { name = "scipy" },
    { name = "ty" },
    { name = "vulture" },
]

[package.metadata]
requires-dist = [
    { name = "bench-nav", editable = "pkg/bench_nav" },
    { name = "cambc", specifier = ">=1.7.1" },
    { name = "hcloud", specifier = ">=2.17.1" },
    { name = "networkx", specifier = ">=3.6.1" },
    { name = "pillow", specifier = ">=12.1.1" },
    { name = "proto", editable = "pkg/proto" },
    { name = "scipy", specifier = ">=1.17.1" },
    { name = "visualiser", editable = "pkg/visualiser" },
]

[package.metadata.requires-dev]
dev = [
    { name = "hcloud", specifier = ">=2.17.1" },
    { name = "matplotlib", specifier = ">=3.10.8" },
    { name = "networkx", specifier = ">=3.6.1" },
    { name = "pandas", specifier = ">=3.0.2" },
    { name = "pillow", specifier = ">=12.1.1" },
    { name = "pre-commit", specifier = ">=4.5.1" },
    { name = "protobuf", specifier = ">=7.34.1" },
    { name = "pydeps", specifier = ">=3.0.2" },
    { name = "ruff" },
    { name = "scipy", specifier = ">=1.17.1" },
    { name = "ty" },
    { name = "vulture", specifier = ">=2.16" },
]

