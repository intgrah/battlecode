[[package]]
name = "battlecode"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "cambc" },
    { name = "networkx" },
    { name = "pillow" },
    { name = "protobuf" },
    { name = "scipy" },
]

[package.dev-dependencies]
dev = [
    { name = "ruff" },
    { name = "ty" },
]

[package.metadata]
requires-dist = [
    { name = "cambc", specifier = ">=1.4.6" },
    { name = "networkx", specifier = ">=3.6.1" },
    { name = "pillow", specifier = ">=12.1.1" },
    { name = "protobuf", specifier = ">=7.34.0" },
    { name = "scipy", specifier = ">=1.17.1" },
]

[package.metadata.requires-dev]
dev = [
    { name = "ruff", specifier = ">=0.15.6" },
    { name = "ty", specifier = ">=0.0.22" },
]

