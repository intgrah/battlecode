[package]
name = "pyrust-translate"
version = "0.1.0"
edition.workspace = true

[lib]
name = "pyrust_translate"
path = "src/lib.rs"

[[bin]]
name = "pyrust-translate"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
quote = "1"

[lints]
workspace = true
