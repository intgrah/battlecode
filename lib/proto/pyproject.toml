[project]
name = "proto"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["protobuf>=7.34.0"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    "A002",   # builtin-argument-shadowing
    "ANN003", # missing-type-kwargs
    "N802",   # invalid-function-name
    "PYI021", # docstring-in-stub
]
